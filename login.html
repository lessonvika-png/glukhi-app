<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вхід — Міст</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .auth-page {
            max-width: 440px;
            margin: 0 auto;
            padding: 60px 5% 100px;
        }

        .auth-page h1 {
            font-size: 1.8rem;
            margin-bottom: 8px;
            color: #ffffff;
            text-align: center;
        }

        .auth-page .subtitle {
            color: #94a3b8;
            text-align: center;
            margin-bottom: 32px;
            font-size: 0.95rem;
        }

        form {
            background-color: #1e293b;
            padding: 28px;
            border-radius: 12px;
        }

        .field {
            margin-bottom: 18px;
        }

        .field label {
            display: block;
            font-size: 0.85rem;
            color: #cbd5e1;
            margin-bottom: 6px;
        }

        .field input {
            width: 100%;
            padding: 11px 14px;
            border-radius: 8px;
            border: 1px solid #334155;
            background-color: #0f172a;
            color: #f1f5f9;
            font-size: 0.95rem;
        }

        .field input:focus {
            outline: none;
            border-color: #38bdf8;
        }

        .submit-btn {
            width: 100%;
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .switch-link {
            text-align: center;
            margin-top: 20px;
            font-size: 0.9rem;
            color: #94a3b8;
        }

        .switch-link a {
            color: #38bdf8;
            text-decoration: none;
        }

        .form-message {
            display: none;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 0.9rem;
            margin-bottom: 18px;
        }

        .form-message.show {
            display: block;
        }

        .form-message.error {
            background-color: rgba(239, 68, 68, 0.12);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .form-message.success {
            background-color: rgba(56, 189, 248, 0.12);
            color: #38bdf8;
            border: 1px solid rgba(56, 189, 248, 0.3);
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo">Міст 🤟</a>
        <nav>
            <a href="index.html#features">Можливості</a>
            <a href="dovidnyk.html">Довідник спільноти</a>
        </nav>
    </header>

    <section class="auth-page">
        <h1>Увійти</h1>
        <p class="subtitle">Радо бачимо знову</p>

        <div class="form-message" id="form-message"></div>

        <form id="login-form">
            <div class="field">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="pошта@example.com" required>
            </div>
            <div class="field">
                <label for="password">Пароль</label>
                <input type="password" id="password" placeholder="Твій пароль" required>
            </div>

            <button type="submit" class="btn submit-btn" id="submit-btn">Увійти</button>
        </form>

        <p class="switch-link">Ще нема акаунту? <a href="register.html">Зареєструватись</a></p>
    </section>

    <footer>
        &copy; 2026 Міст. Проєкт для доступного спілкування.
    </footer>

    <script>
        const API_URL = "https://glukhi-app-backend.onrender.com";

        function showMessage(text, type) {
            const box = document.getElementById('form-message');
            box.textContent = text;
            box.className = `form-message show ${type}`;
        }

        document.getElementById('login-form').addEventListener('submit', async function (event) {
            event.preventDefault();

            const submitBtn = document.getElementById('submit-btn');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Входимо...';

            const payload = {
                email: document.getElementById('email').value,
                password: document.getElementById('password').value,
            };

            try {
                const response = await fetch(`${API_URL}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload),
                });

                const data = await response.json();

                if (!response.ok) {
                    showMessage(data.detail || 'Щось пішло не так. Спробуй ще раз.', 'error');
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Увійти';
                    return;
                }

                showMessage(`Вхід успішний! Привіт, ${data.name}.`, 'success');
                submitBtn.textContent = 'Увійдено ✓';

                // Зберігаємо токен і дані користувача в браузері — це і є "запам'ятовування входу".
                // localStorage не стирається при закритті вкладки чи перезавантаженні сторінки.
                localStorage.setItem('mist_token', data.access_token);
                localStorage.setItem('mist_user', JSON.stringify({
                    id: data.id,
                    name: data.name,
                    email: data.email,
                    role: data.role,
                }));

                // Через секунду переносимо на головну — щоб побачити результат входу одразу
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 800);

            } catch (error) {
                showMessage('Не вдалось з\'єднатись із сервером. Перевір, чи запущений бекенд.', 'error');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Увійти';
            }
        });
    </script>

</body>
</html>
