<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Урок — Міст</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .lesson-page {
            max-width: 640px;
            margin: 0 auto;
            padding: 32px 5% 80px;
        }

        .lesson-top {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 28px;
        }

        .close-btn {
            text-decoration: none;
            color: #94a3b8;
            font-size: 1.4rem;
            line-height: 1;
            padding: 4px 8px;
            border-radius: 6px;
        }

        .close-btn:hover { color: #f1f5f9; background: #1e293b; }

        .progress {
            flex: 1;
            height: 12px;
            background: #1e293b;
            border-radius: 999px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 0;
            background: #38bdf8;
            border-radius: 999px;
            transition: width 0.35s ease;
        }

        .step-label {
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: #38bdf8;
            margin-bottom: 8px;
        }

        .step-title {
            font-size: 1.5rem;
            color: #ffffff;
            margin-bottom: 22px;
        }

        /* ===== Video ===== */

        .video-box {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #020617;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #1e293b;
        }

        .video-box video,
        .video-box iframe {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: 0;
            object-fit: contain;
        }

        .video-placeholder {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            color: #64748b;
            text-align: center;
            padding: 12px;
        }

        .video-placeholder .emoji { font-size: 2.6rem; }
        .video-placeholder small { font-size: 0.8rem; }

        .video-controls {
            display: flex;
            gap: 10px;
            margin-top: 12px;
        }

        .ctrl {
            background: #1e293b;
            color: #cbd5e1;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 8px 14px;
            font-size: 0.9rem;
            cursor: pointer;
        }

        .ctrl:hover { border-color: #38bdf8; color: #38bdf8; }
        .ctrl.active { border-color: #38bdf8; color: #38bdf8; }

        .learn-word {
            font-size: 2rem;
            font-weight: 700;
            text-align: center;
            margin: 22px 0 6px;
            color: #ffffff;
        }

        .learn-hint {
            text-align: center;
            color: #94a3b8;
            font-size: 0.95rem;
        }

        /* ===== Options ===== */

        .options {
            display: grid;
            gap: 12px;
            margin-top: 22px;
        }

        .options.videos {
            grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
            margin-top: 0;
        }

        .option {
            background: #1e293b;
            border: 2px solid #334155;
            border-radius: 12px;
            padding: 16px 18px;
            color: #f1f5f9;
            font-size: 1.05rem;
            font-weight: 600;
            text-align: left;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: border-color 0.15s, background 0.15s;
            font-family: inherit;
        }

        .option:hover:not(:disabled) { border-color: #38bdf8; }

        .option .key {
            flex: none;
            width: 26px;
            height: 26px;
            border-radius: 6px;
            border: 1px solid #475569;
            display: grid;
            place-items: center;
            font-size: 0.8rem;
            color: #94a3b8;
        }

        .options.videos .option {
            flex-direction: column;
            align-items: stretch;
            padding: 10px;
        }

        .options.videos .video-placeholder .emoji { font-size: 1.6rem; }
        .options.videos .video-placeholder > span:not(.emoji) { display: none; }
        .options.videos .video-placeholder small { font-size: 0.75rem; line-height: 1.3; }

        .option.selected { border-color: #38bdf8; background: #0c2a3d; }
        .option.correct  { border-color: #22c55e; background: #0f2e1d; }
        .option.wrong    { border-color: #ef4444; background: #3a1414; }
        .option:disabled { cursor: default; }

        /* ===== Bottom bar ===== */

        .bottom-bar {
            margin-top: 28px;
            padding: 18px 20px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            flex-wrap: wrap;
            background: transparent;
        }

        .bottom-bar.ok  { background: #0f2e1d; }
        .bottom-bar.bad { background: #3a1414; }

        .feedback { font-weight: 600; }
        .feedback.ok  { color: #4ade80; }
        .feedback.bad { color: #f87171; }
        .feedback small { display: block; font-weight: 400; color: #cbd5e1; }

        .btn:disabled { opacity: 0.4; cursor: default; }
        .bottom-bar .btn { margin-left: auto; }

        /* ===== Start / finish ===== */

        .center-card { text-align: center; padding: 44px 28px; }
        .center-card .big { font-size: 3rem; margin-bottom: 10px; }
        .center-card h1 { font-size: 1.8rem; margin-bottom: 8px; color: #fff; }
        .center-card p { color: #94a3b8; margin-bottom: 24px; }

        .stats {
            display: flex;
            justify-content: center;
            gap: 14px;
            margin-bottom: 28px;
            flex-wrap: wrap;
        }

        .stat {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 12px 20px;
            min-width: 120px;
        }

        .stat b { display: block; font-size: 1.5rem; color: #38bdf8; }
        .stat span { font-size: 0.85rem; color: #94a3b8; }

        .actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    </style>
</head>
<body>

    <main class="lesson-page">
        <div class="lesson-top">
            <a href="navchannya.html" class="close-btn" title="Вийти з уроку">✕</a>
            <div class="progress"><div class="progress-fill" id="progress"></div></div>
        </div>

        <div id="screen"></div>
    </main>

    <script src="lessons.js"></script>
    <script>
        const params = new URLSearchParams(location.search);
        const lessonId = params.get('id') || '1';
        const lesson = LESSONS[lessonId];
        const screen = document.getElementById('screen');
        const progressEl = document.getElementById('progress');

        let queue = [];        // кроки, що залишились
        let doneCount = 0;     // скільки кроків пройдено
        let totalCount = 0;    // загальна кількість (росте, коли повторюємо помилки)
        let answered = 0;      // скільки разів відповідали на перевірки
        let correctFirstTry = 0;
        let mistakes = new Set();
        let current = null;
        let selectedIndex = null;
        let state = 'idle';    // idle | choosing | checked

        // ---------- Відео ----------

        function videoHtml(wordKey, opts = {}) {
            const w = WORDS[wordKey];
            if (w.youtube) {
                const id = encodeURIComponent(w.youtube);
                return `<iframe data-yt
                    src="https://www.youtube-nocookie.com/embed/${id}?autoplay=1&mute=1&loop=1&playlist=${id}&controls=0&rel=0&playsinline=1&modestbranding=1&enablejsapi=1"
                    allow="autoplay; encrypted-media" title="Жест"></iframe>`;
            }
            if (w.video) {
                return `<video src="${w.video}" autoplay muted loop playsinline></video>`;
            }
            // Заглушка: у перевірках підпис потрібен, щоб демо можна було пройти без відео.
            return `<div class="video-placeholder">
                <span class="emoji">🤟</span>
                <span>Відео ще не додано</span>
                ${opts.revealName ? `<small>заглушка: «${w.text}»</small>` : ''}
            </div>`;
        }

        function controlsHtml() {
            return `<div class="video-controls">
                <button class="ctrl" onclick="replay(this)">↺ Ще раз</button>
                <button class="ctrl" onclick="toggleSlow(this)">🐢 Повільніше</button>
            </div>`;
        }

        function ytCommand(iframe, func, args = []) {
            iframe.contentWindow?.postMessage(JSON.stringify({ event: 'command', func, args }), '*');
        }

        function boxOf(btn) {
            return btn.closest('.video-wrap').querySelector('.video-box');
        }

        function replay(btn) {
            const box = boxOf(btn);
            const v = box.querySelector('video');
            const yt = box.querySelector('iframe[data-yt]');
            if (v) { v.currentTime = 0; v.play(); }
            if (yt) { ytCommand(yt, 'seekTo', [0, true]); ytCommand(yt, 'playVideo'); }
        }

        function toggleSlow(btn) {
            const slow = !btn.classList.contains('active');
            btn.classList.toggle('active', slow);
            const rate = slow ? 0.5 : 1;
            const box = boxOf(btn);
            const v = box.querySelector('video');
            const yt = box.querySelector('iframe[data-yt]');
            if (v) v.playbackRate = rate;
            if (yt) ytCommand(yt, 'setPlaybackRate', [rate]);
        }

        // ---------- Допоміжне ----------

        function shuffle(arr) {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        function lessonWords() {
            return [...new Set(lesson.steps.map(s => s.word))];
        }

        // Неправильні варіанти: слова цього уроку, а якщо їх замало — з попередніх.
        function buildOptions(correct, count) {
            let pool = lessonWords().filter(k => k !== correct);
            if (pool.length < count - 1) {
                const extra = Object.keys(WORDS).filter(k => k !== correct && !pool.includes(k));
                pool = pool.concat(extra);
            }
            return shuffle([correct, ...shuffle(pool).slice(0, count - 1)]);
        }

        function updateProgress() {
            const pct = totalCount ? (doneCount / totalCount) * 100 : 0;
            progressEl.style.width = pct + '%';
        }

        // ---------- Екрани ----------

        function renderStart() {
            screen.innerHTML = `
                <div class="card center-card">
                    <div class="big">👋</div>
                    <div class="step-label">Урок ${lessonId}${lesson.demo ? ' · демо' : ''}</div>
                    <h1>${lesson.title}</h1>
                    <p>${lesson.subtitle}<br>Спочатку дивишся жест, потім перевіряєш себе.</p>
                    <button class="btn" onclick="startLesson()">Почати</button>
                </div>`;
        }

        function startLesson() {
            queue = lesson.steps.map(s => ({ ...s }));
            totalCount = queue.length;
            doneCount = 0;
            answered = 0;
            correctFirstTry = 0;
            mistakes = new Set();
            nextStep();
        }

        function nextStep() {
            updateProgress();
            current = queue.shift();
            selectedIndex = null;
            if (!current) return renderFinish();

            if (current.type === 'learn') renderLearn();
            else if (current.type === 'video_to_word') renderVideoToWord();
            else if (current.type === 'word_to_video') renderWordToVideo();
            else { doneCount++; nextStep(); } // невідомий тип — пропускаємо
        }

        function renderLearn() {
            const w = WORDS[current.word];
            state = 'checked';
            screen.innerHTML = `
                <div class="step-label">Новий жест</div>
                <h2 class="step-title">Подивись і повтори</h2>
                <div class="video-wrap">
                    <div class="video-box">${videoHtml(current.word)}</div>
                    ${controlsHtml()}
                </div>
                <div class="learn-word">${w.text}</div>
                ${w.opys ? `<p class="learn-hint">${w.opys}</p>` : ''}
                <div class="bottom-bar">
                    <button class="btn" id="next-btn" onclick="finishStep()">Далі</button>
                </div>`;
            document.getElementById('next-btn').focus();
        }

        function renderVideoToWord() {
            current.options = current.options || buildOptions(current.word, 3);
            state = 'choosing';
            screen.innerHTML = `
                <div class="step-label">Перевірка</div>
                <h2 class="step-title">Що означає цей жест?</h2>
                <div class="video-wrap">
                    <div class="video-box">${videoHtml(current.word)}</div>
                    ${controlsHtml()}
                </div>
                <div class="options">
                    ${current.options.map((k, i) => `
                        <button class="option" data-i="${i}" onclick="selectOption(${i})">
                            <span class="key">${i + 1}</span>${WORDS[k].text}
                        </button>`).join('')}
                </div>
                ${bottomBarHtml()}`;
        }

        function renderWordToVideo() {
            current.options = current.options || buildOptions(current.word, 3);
            state = 'choosing';
            screen.innerHTML = `
                <div class="step-label">Перевірка</div>
                <h2 class="step-title">Обери жест: «${WORDS[current.word].text}»</h2>
                <div class="options videos">
                    ${current.options.map((k, i) => `
                        <button class="option" data-i="${i}" onclick="selectOption(${i})">
                            <div class="video-box">${videoHtml(k, { revealName: true })}</div>
                            <span class="key" style="align-self:center">${i + 1}</span>
                        </button>`).join('')}
                </div>
                ${bottomBarHtml()}`;
        }

        function bottomBarHtml() {
            return `<div class="bottom-bar" id="bar">
                <div class="feedback" id="feedback"></div>
                <button class="btn" id="check-btn" onclick="checkAnswer()" disabled>Перевірити</button>
            </div>`;
        }

        function selectOption(i) {
            if (state !== 'choosing') return;
            selectedIndex = i;
            document.querySelectorAll('.option').forEach(el =>
                el.classList.toggle('selected', Number(el.dataset.i) === i));
            document.getElementById('check-btn').disabled = false;
        }

        function checkAnswer() {
            if (state !== 'choosing' || selectedIndex === null) return;
            state = 'checked';
            const chosen = current.options[selectedIndex];
            const ok = chosen === current.word;
            answered++;

            document.querySelectorAll('.option').forEach(el => {
                const k = current.options[Number(el.dataset.i)];
                el.disabled = true;
                el.classList.remove('selected');
                if (k === current.word) el.classList.add('correct');
                else if (Number(el.dataset.i) === selectedIndex) el.classList.add('wrong');
            });

            const bar = document.getElementById('bar');
            const fb = document.getElementById('feedback');
            if (ok) {
                if (!current.retry) correctFirstTry++;
                bar.classList.add('ok');
                fb.className = 'feedback ok';
                fb.innerHTML = 'Правильно! 🎉';
            } else {
                mistakes.add(current.word);
                // Помилку повторимо наприкінці уроку (один раз)
                if (!current.retry) {
                    queue.push({ type: current.type, word: current.word, retry: true });
                    totalCount++;
                }
                bar.classList.add('bad');
                fb.className = 'feedback bad';
                fb.innerHTML = `Не зовсім <small>Правильна відповідь: «${WORDS[current.word].text}». Повернемось до нього наприкінці.</small>`;
            }

            const btn = document.getElementById('check-btn');
            btn.textContent = 'Далі';
            btn.onclick = finishStep;
            btn.focus();
        }

        function finishStep() {
            doneCount++;
            nextStep();
        }

        function saveProgress(score) {
            try {
                const all = JSON.parse(localStorage.getItem('mist_progress') || '{}');
                const prev = all[lessonId];
                all[lessonId] = {
                    done: true,
                    best: Math.max(score, prev?.best || 0),
                    date: new Date().toISOString(),
                };
                localStorage.setItem('mist_progress', JSON.stringify(all));
            } catch (e) { /* сховище недоступне — не страшно */ }
        }

        function renderFinish() {
            progressEl.style.width = '100%';
            const firstTryChecks = lesson.steps.filter(s => s.type !== 'learn').length;
            const score = firstTryChecks ? Math.round((correctFirstTry / firstTryChecks) * 100) : 100;
            saveProgress(score);
            const learned = lessonWords().length;
            const nextId = String(Number(lessonId) + 1);
            const hasNext = Boolean(LESSONS[nextId]);

            screen.innerHTML = `
                <div class="card center-card">
                    <div class="big">${score >= 80 ? '🏆' : '💪'}</div>
                    <h1>Урок пройдено!</h1>
                    <p>${score >= 80 ? 'Чудова робота.' : 'Добрий початок — повтори ще раз, щоб закріпити.'}</p>
                    <div class="stats">
                        <div class="stat"><b>${learned}</b><span>жести</span></div>
                        <div class="stat"><b>${score}%</b><span>з першої спроби</span></div>
                    </div>
                    ${mistakes.size ? `<p>Варто повторити: ${[...mistakes].map(k => '«' + WORDS[k].text + '»').join(', ')}</p>` : ''}
                    <div class="actions">
                        <button class="btn-outline" onclick="startLesson()">Пройти ще раз</button>
                        ${hasNext
                            ? `<a class="btn" href="urok.html?id=${nextId}">Наступний урок</a>`
                            : `<a class="btn" href="navchannya.html">До списку уроків</a>`}
                    </div>
                </div>`;
        }

        // ---------- Клавіатура: 1–3 обрати, Enter перевірити/далі ----------

        document.addEventListener('keydown', e => {
            if (!current) return;
            const n = Number(e.key);
            if (state === 'choosing' && n >= 1 && n <= (current.options?.length || 0)) {
                selectOption(n - 1);
            } else if (e.key === 'Enter' && state === 'choosing' && selectedIndex !== null) {
                e.preventDefault();
                checkAnswer();
            }
        });

        // ---------- Старт ----------

        if (!lesson) {
            screen.innerHTML = `<div class="card center-card">
                <div class="big">🤔</div><h1>Урок не знайдено</h1>
                <p>Такого уроку ще немає.</p>
                <a class="btn" href="navchannya.html">До списку уроків</a></div>`;
        } else {
            document.title = `Урок ${lessonId} · ${lesson.title} — Міст`;
            renderStart();
        }
    </script>
</body>
</html>
